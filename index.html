<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Verification</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
        .upload-area { background: #fff; border: 2px dashed #ccc; border-radius: 8px; padding: 40px; text-align: center; margin-bottom: 20px; cursor: pointer; transition: border-color 0.3s; }
        .upload-area:hover { border-color: #4a90d9; }
        .upload-area input { display: none; }
        .results { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #4a90d9; color: #fff; position: sticky; top: 0; }
        tr:nth-child(even) { background: #f9f9f9; }
        .status-ok { color: green; font-weight: bold; }
        .status-err { color: red; font-weight: bold; }
        .loading { text-align: center; padding: 20px; display: none; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #4a90d9; border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <h1>Invoice Verification Tool</h1>
    <div class="upload-area" id="uploadArea">
        <p>📄 Klik atau drag & drop file PDF invoice di sini</p>
        <p style="font-size:12px;color:#888;margin-top:8px;">Bisa upload banyak file sekaligus</p>
        <input type="file" id="fileInput" multiple accept=".pdf">
    </div>
    <div class="loading" id="loading"><div class="spinner"></div><p>Memproses PDF...</p></div>
    <div class="results" id="results" style="display:none;">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>File</th>
                    <th>No. Invoice</th>
                    <th>Tanggal</th>
                    <th>Total Harga Produk</th>
                    <th>Diskon Ongkos Kirim</th>
                    <th>Biaya Asuransi Pengiriman</th>
                    <th>Biaya Jasa Aplikasi</th>
                    <th>Total Pembayaran</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>
<script>
// PDF.js worker
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');
const loading = document.getElementById('loading');
const results = document.getElementById('results');
const tableBody = document.getElementById('tableBody');
let rowCount = 0;

uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = '#4a90d9'; });
uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = '#ccc'; });
uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.style.borderColor = '#ccc'; handleFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', e => handleFiles(e.target.files));

async function handleFiles(files) {
    if (!files.length) return;
    loading.style.display = 'block';
    for (const file of files) {
        try {
            const text = await extractTextFromPDF(file);
            const data = parseInvoice(text);
            addRow(file.name, data);
        } catch (err) {
            addRow(file.name, { error: err.message });
        }
    }
    loading.style.display = 'none';
    results.style.display = 'block';
}

async function extractTextFromPDF(file) {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let fullText = '';
    for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        fullText += content.items.map(item => item.str).join(' ') + '\n';
    }
    return fullText;
}

function normalizePdfText(text) {
    return text
        .replace(/[\u2010\u2011\u2012\u2013\u2014\u2015\u2212\uFE58\uFE63\uFF0D]/g, '-')
        .replace(/\s+/g, ' ')
        .trim();
}

function extractField(text, patterns) {
    for (const pattern of patterns) {
        const match = text.match(pattern);
        if (match) {
            let val = match[1].replace(/[^\d.,\-]/g, '').replace(/\./g, '').replace(',', '.');
            return parseFloat(val) || 0;
        }
    }
    return 0;
}

function parseInvoice(rawText) {
    const text = normalizePdfText(rawText);
    try {
        // No. Invoice
        const invMatch = text.match(/(?:No\.?\s*Invoice|Invoice\s*No\.?|Nomor\s*Invoice)[:\s]*([A-Za-z0-9\-\/]+)/i);
        const noInvoice = invMatch ? invMatch[1].trim() : '-';

        // Tanggal
        const tglMatch = text.match(/(?:Tanggal|Tgl|Date)[:\s]*(\d{1,2}[\s\-\/]\w+[\s\-\/]\d{2,4})/i);
        const tanggal = tglMatch ? tglMatch[1].trim() : '-';

        // Total Harga Produk
        const totalProdukPatterns = [
            /Total\s*Harga\s*(?:Produk|Barang)[:\s]*-?\s*Rp\.?\s*([\d.,]+)/i,
            /Total\s*Harga\s*(?:Produk|Barang)[:\s]*([\d.,]+)/i,
            /Harga\s*Produk[:\s]*Rp\.?\s*([\d.,]+)/i
        ];
        const totalProduk = extractField(text, totalProdukPatterns);

        // Diskon Ongkos Kirim
        const diskonOngkirPatterns = [
            /Diskon\s*Ongkos\s*Kirim[:\s]*-?\s*Rp\.?\s*([\d.,\-]+)/i,
            /Diskon\s*Ongkir[:\s]*-?\s*Rp\.?\s*([\d.,\-]+)/i,
            /Diskon\s*Ongkos\s*Kirim[:\s]*([\d.,\-]+)/i,
            /Diskon\s*Ongkir[:\s]*([\d.,\-]+)/i
        ];
        const diskonOngkir = extractField(text, diskonOngkirPatterns);

        // Biaya Asuransi Pengiriman
        const asuransiPatterns = [
            /Biaya\s*Asuransi\s*Pengiriman[:\s]*-?\s*Rp\.?\s*([\d.,\-]+)/i,
            /Asuransi\s*Pengiriman[:\s]*-?\s*Rp\.?\s*([\d.,\-]+)/i,
            /Biaya\s*Asuransi\s*Pengiriman[:\s]*([\d.,\-]+)/i,
            /Asuransi\s*Pengiriman[:\s]*([\d.,\-]+)/i
        ];
        const asuransi = extractField(text, asuransiPatterns);

        // Biaya Jasa Aplikasi
        const jasaAplikasiPatterns = [
            /Biaya\s*Jasa\s*Aplikasi[:\s]*-?\s*Rp\.?\s*([\d.,\-]+)/i,
            /Jasa\s*Aplikasi[:\s]*-?\s*Rp\.?\s*([\d.,\-]+)/i,
            /Biaya\s*Jasa\s*Aplikasi[:\s]*([\d.,\-]+)/i,
            /Jasa\s*Aplikasi[:\s]*([\d.,\-]+)/i,
            /Biaya\s*Layanan\s*Aplikasi[:\s]*-?\s*Rp\.?\s*([\d.,\-]+)/i
        ];
        const jasaAplikasi = extractField(text, jasaAplikasiPatterns);

        // Total Pembayaran
        const totalBayarPatterns = [
            /Total\s*Pembayaran[:\s]*-?\s*Rp\.?\s*([\d.,]+)/i,
            /Total\s*Bayar[:\s]*-?\s*Rp\.?\s*([\d.,]+)/i,
            /Total\s*Pembayaran[:\s]*([\d.,]+)/i
        ];
        const totalBayar = extractField(text, totalBayarPatterns);

        return { noInvoice, tanggal, totalProduk, diskonOngkir, asuransi, jasaAplikasi, totalBayar };
    } catch (e) {
        return { error: e.message };
    }
}

function formatRupiah(num) {
    if (num === 0) return 'Rp 0';
    return 'Rp ' + Math.abs(num).toLocaleString('id-ID') + (num < 0 ? ' (-)' : '');
}

function addRow(filename, data) {
    rowCount++;
    const tr = document.createElement('tr');
    if (data.error) {
        tr.innerHTML = `<td>${rowCount}</td><td>${filename}</td><td colspan="8" class="status-err">Error: ${data.error}</td>`;
    } else {
        const status = data.totalBayar > 0 ? '<span class="status-ok">✓ OK</span>' : '<span class="status-err">⚠ Cek</span>';
        tr.innerHTML = `
            <td>${rowCount}</td>
            <td>${filename}</td>
            <td>${data.noInvoice}</td>
            <td>${data.tanggal}</td>
            <td>${formatRupiah(data.totalProduk)}</td>
            <td>${formatRupiah(data.diskonOngkir)}</td>
            <td>${formatRupiah(data.asuransi)}</td>
            <td>${formatRupiah(data.jasaAplikasi)}</td>
            <td>${formatRupiah(data.totalBayar)}</td>
            <td>${status}</td>
        `;
    }
    tableBody.appendChild(tr);
}
</script>
</body>
</html>
